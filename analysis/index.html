const $card = document.getElementById('card');

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function dateLabel(key) {
  const [y, m, d] = key.split('-').map(Number);
  return `${key} (${WEEKDAYS[new Date(y, m - 1, d).getDay()]})`;
}

function isConfigured() {
  return SUPABASE_URL.startsWith('https://') && !SUPABASE_ANON_KEY.startsWith('__');
}

async function rest(query) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/guru_votes?${query}`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
  });
  if (!res.ok) throw new Error(`Supabase ${res.status}`);
  return res.json();
}

function stateHtml(emoji, title, desc) {
  return `<div class="va-state"><div class="emoji">${emoji}</div><h2>${esc(title)}</h2><p>${esc(desc)}</p></div>`;
}

function verdictHtml(score) {
  if (typeof score !== 'number' || score < 0 || score > 3) {
    return '<span class="verdict-none">미판정</span>';
  }
  const v = VERDICTS[score];
  return `<span class="verdict ${v.cls}">${v.label}</span>`;
}

function tallyHtml(tally, total) {
  const entries = VERDICTS.map((v, i) => ({ ...v, n: tally[i] })).filter((e) => e.n > 0);
  if (total === 0) return '<span class="verdict-none">—</span>';
  const bars = entries
    .map((e) => `<i class="${e.seg}" style="width:${(e.n / total) * 100}%"></i>`)
    .join('');
  const legend = entries
    .map((e) => `<span><i class="${e.seg}"></i>${e.label} ${e.n}</span>`)
    .join('');
  return `<div class="tally"><div class="tally-bar" role="img" aria-label="표결 분포">${bars}</div><div class="tally-legend">${legend}</div></div>`;
}

function rowHtml(row) {
  const scores = [];
  for (let i = 1; i <= 13; i++) scores.push(row[`g${i}`]);
  const tally = [0, 0, 0, 0];
  let voted = 0;
  for (const s of scores) {
    if (typeof s === 'number' && s >= 0 && s <= 3) { tally[s] += 1; voted += 1; }
  }
  const screeners = (row.screeners || [])
    .map((s) => `<span>${esc(s)}</span>`)
    .join('') || '<span class="verdict-none">—</span>';
  const gurus = GURU_INFO
    .map((g, i) => `<div class="guru-cell" data-guru="${i}" role="button" tabindex="0" aria-label="${esc(g.name)} 소개 보기">
      <span class="guru-who"><img class="guru-avatar" src="../assets/gurus/${g.avatar}.png" alt="" width="300" height="300" loading="lazy" /><b>${esc(g.name)}</b></span>${verdictHtml(scores[i])}</div>`)
    .join('');

  return `
    <tr class="va-row" data-ticker="${esc(row.ticker)}">
      <td class="va-ticker">${esc(row.ticker)}</td>
      <td class="va-name">${esc(row.name || row.ticker)}</td>
      <td>${verdictHtml(row.g0)}</td>
      <td>${tallyHtml(tally, voted)}</td>
      <td style="text-align:center"><span class="va-count">${voted}/13</span></td>
      <td><div class="va-screeners">${screeners}</div></td>
      <td class="va-chevron">▸</td>
    </tr>
    <tr class="va-detail" hidden>
      <td colspan="7">
        <div class="trend" data-ticker="${esc(row.ticker)}">
          <div class="trend-head">
            <h3>일자별 표결 추이</h3>
            <p>아래부터 매수 · 보유 · 관망 · 매도 순서예요. 숫자는 그날 그 의견을 낸 거장 수예요.</p>
          </div>
          <div class="trend-body"><div class="skeleton" aria-hidden="true"></div></div>
        </div>
        <div class="guru-grid">${gurus}</div>
      </td>
    </tr>`;
}

function renderRows(rows) {
  if (rows.length === 0) {
    $card.innerHTML = stateHtml('📭', '이 날짜에는 표결한 종목이 없어요', '다른 날짜를 골라 보세요.');
    return;
  }
  $card.innerHTML = `
    <div class="va-scroll">
      <table class="va">
        <thead>
          <tr>
            <th>종목 코드</th><th>종목명</th><th>종합의견</th><th>표결 통계</th>
            <th style="text-align:center">판정 인원</th><th>스크리너</th><th></th>
          </tr>
        </thead>
        <tbody>${rows.map(rowHtml).join('')}</tbody>
      </table>
    </div>`;

  for (const tr of $card.querySelectorAll('tr.va-row')) {
    tr.addEventListener('click', () => {
      const detail = tr.nextElementSibling;
      const wasOpen = !detail.hidden;
      for (const d of $card.querySelectorAll('tr.va-detail')) d.hidden = true;
      for (const r of $card.querySelectorAll('tr.va-row')) {
        r.classList.remove('open');
        r.querySelector('.va-chevron').textContent = '▸';
      }
      if (!wasOpen) {
        detail.hidden = false;
        tr.classList.add('open');
        tr.querySelector('.va-chevron').textContent = '▾';
        loadTrend(detail.querySelector('.trend'));
      }
    });
  }
}

// ── 거장 소개 팝오버(마우스 오버·클릭·키보드) ─────────────
const $pop = document.createElement('div');
$pop.className = 'guru-pop';
$pop.hidden = true;
$pop.setAttribute('role', 'dialog');
document.body.appendChild($pop);
let popCell = null;       // 팝오버가 붙어 있는 셀
let popPinned = false;    // 클릭으로 고정했는지(고정이면 마우스가 떠나도 유지)

function showGuruPop(cell, pinned) {
  const g = GURU_INFO[Number(cell.dataset.guru)];
  if (!g) return;
  if (popCell !== cell) {
    $pop.innerHTML = `
      <div class="guru-pop-head">
        <img src="../assets/gurus/${g.avatar}.png" alt="" width="300" height="300" />
        <div><strong>${esc(g.name)}</strong><span>${esc(g.style)}</span></div>
      </div>
      <p>${esc(g.desc)}</p>
      <div class="guru-pop-book">📘 대표 서적 <b>${esc(g.book)}</b></div>`;
  }
  if (popCell && popCell !== cell) popCell.classList.remove('active');
  popCell = cell;
  popPinned = pinned || (popPinned && popCell === cell);
  cell.classList.add('active');
  $pop.hidden = false;

  // 셀 아래에 붙이되, 화면 오른쪽·아래로 넘치면 안쪽으로 밀어 넣는다
  const r = cell.getBoundingClientRect();
  const pw = $pop.offsetWidth, ph = $pop.offsetHeight;
  let left = r.left + window.scrollX;
  let top = r.bottom + window.scrollY + 8;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - pw - 16;
  if (left > maxLeft) left = Math.max(window.scrollX + 16, maxLeft);
  if (r.bottom + 8 + ph > window.innerHeight && r.top - 8 - ph > 0) top = r.top + window.scrollY - ph - 8;
  $pop.style.left = `${left}px`;
  $pop.style.top = `${top}px`;
}

function hideGuruPop() {
  if (popCell) popCell.classList.remove('active');
  popCell = null;
  popPinned = false;
  $pop.hidden = true;
}

document.addEventListener('mouseover', (e) => {
  const cell = e.target.closest('.guru-cell');
  if (cell && !popPinned) showGuruPop(cell, false);
});
document.addEventListener('mouseout', (e) => {
  if (popPinned || !popCell) return;
  const leavingCell = e.target.closest('.guru-cell') === popCell;
  const leavingPop = $pop.contains(e.target);
  if (!leavingCell && !leavingPop) return;
  const to = e.relatedTarget;
  if (to && (popCell.contains(to) || $pop.contains(to))) return;
  hideGuruPop();
});
document.addEventListener('click', (e) => {
  const cell = e.target.closest('.guru-cell');
  if (cell) {
    e.stopPropagation();
    if (popPinned && popCell === cell) hideGuruPop();
    else showGuruPop(cell, true);
    return;
  }
  if (!$pop.contains(e.target)) hideGuruPop();
});
document.addEventListener('keydown', (e) => {
  const cell = e.target.closest?.('.guru-cell');
  if (cell && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showGuruPop(cell, true); }
  if (e.key === 'Escape') hideGuruPop();
});
document.addEventListener('focusin', (e) => {
  const cell = e.target.closest?.('.guru-cell');
  if (cell && !popPinned) showGuruPop(cell, false);
});
document.addEventListener('focusout', (e) => {
  if (!popPinned && e.target.closest?.('.guru-cell') && !$pop.contains(e.relatedTarget)) hideGuruPop();
});
window.addEventListener('scroll', () => { if (popCell) showGuruPop(popCell, popPinned); }, { passive: true });
window.addEventListener('resize', () => { if (popCell) showGuruPop(popCell, popPinned); });

// ── 일자별 표결 추이(100% 누적 막대) ──────────────────────
const SEG_COLORS = ['#f04452', '#4e5968', '#c5cbd3', '#03b26c']; // 매수·보유·관망·매도 (tally 미니바와 동일)
const SEG_INK = ['#ffffff', '#ffffff', '#191f28', '#ffffff'];
const trendCache = new Map();
let currentDate = null;

function tallyOf(row) {
  const tally = [0, 0, 0, 0];
  for (let i = 1; i <= 13; i++) {
    const s = row[`g${i}`];
    if (typeof s === 'number' && s >= 0 && s <= 3) tally[s] += 1;
  }
  return tally;
}

function trendSvg(rows) {
  const PAD_L = 40, PAD_R = 12, PAD_T = 30, PAD_B = 30;
  const COL = 72, GAP = 2, PLOT_H = 200;
  const W = PAD_L + rows.length * COL + PAD_R;
  const H = PAD_T + PLOT_H + PAD_B;
  const barW = Math.min(44, COL * 0.62);
  let s = '';

  // y축 눈금(0·50·100%)과 안내선
  for (const pct of [0, 50, 100]) {
    const y = PAD_T + PLOT_H - (PLOT_H * pct) / 100;
    s += `<line x1="${PAD_L}" x2="${W - PAD_R}" y1="${y}" y2="${y}" stroke="#e5e8eb" stroke-width="1"/>`;
    s += `<text x="${PAD_L - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#8b95a1">${pct}%</text>`;
  }

  rows.forEach((row, idx) => {
    const tally = tallyOf(row);
    const total = tally.reduce((a, b) => a + b, 0);
    const cx = PAD_L + idx * COL + COL / 2;
    const x = cx - barW / 2;
    const [, m, d] = row.d.split('-').map(Number);
    const isCurrent = row.d === currentDate;
    const title = `${dateLabel(row.d)} · 매수 ${tally[0]} · 보유 ${tally[1]} · 관망 ${tally[2]} · 매도 ${tally[3]}`;

    if (total === 0) {
      s += `<rect x="${x}" y="${PAD_T}" width="${barW}" height="${PLOT_H}" rx="4" fill="none" stroke="#e5e8eb" stroke-dasharray="4 3"><title>${esc(dateLabel(row.d))} · 미판정</title></rect>`;
      s += `<text x="${cx}" y="${PAD_T + PLOT_H / 2 + 4}" text-anchor="middle" font-size="11" fill="#8b95a1">미판정</text>`;
    } else {
      // 아래부터 매수(0) → 보유 → 관망 → 매도(3) 순으로 쌓는다
      let yTop = PAD_T + PLOT_H;
      tally.forEach((n, v) => {
        if (n === 0) return;
        const h = (PLOT_H * n) / total;
        yTop -= h;
        const y = yTop + GAP / 2;
        const hh = Math.max(0, h - GAP);
        s += `<rect x="${x}" y="${y}" width="${barW}" height="${hh}" rx="3" fill="${SEG_COLORS[v]}"><title>${esc(title)}</title></rect>`;
        if (hh >= 12) {
          s += `<text x="${cx}" y="${y + hh / 2 + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="${SEG_INK[v]}" pointer-events="none">${n}</text>`;
        }
      });
    }

    // 막대 위: 그날의 종합의견
    const g0 = row.g0;
    if (typeof g0 === 'number' && g0 >= 0 && g0 <= 3) {
      s += `<text x="${cx}" y="${PAD_T - 10}" text-anchor="middle" font-size="11" font-weight="700" fill="${g0 === 2 ? '#8b95a1' : SEG_COLORS[g0]}">${VERDICTS[g0].label}</text>`;
    }
    // 막대 아래: 날짜
    s += `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="11" font-weight="${isCurrent ? 800 : 500}" fill="${isCurrent ? '#191f28' : '#4e5968'}">${m}/${d}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="일자별 표결 추이 100% 누적 막대 차트">${s}</svg>`;
}

async function loadTrend(box) {
  const ticker = box.dataset.ticker;
  const body = box.querySelector('.trend-body');
  try {
    let rows = trendCache.get(ticker);
    if (!rows) {
      rows = await rest(`ticker=eq.${encodeURIComponent(ticker)}&select=d,g0,g1,g2,g3,g4,g5,g6,g7,g8,g9,g10,g11,g12,g13&order=d.asc`);
      trendCache.set(ticker, rows);
    }
    if (rows.length === 0) {
      body.innerHTML = '<p class="trend-state">쌓인 표결이 없어요.</p>';
      return;
    }
    const legend = VERDICTS
      .map((v, i) => `<span><i style="background:${SEG_COLORS[i]}"></i>${v.label}</span>`)
      .join('');
    body.innerHTML = `<div class="trend-scroll">${trendSvg(rows)}</div><div class="trend-legend">${legend}</div>`;
  } catch {
    body.innerHTML = '<p class="trend-state">추이를 불러오지 못했어요. 잠시 뒤 다시 펼쳐 보세요.</p>';
  }
}

async function loadDate(date) {
  currentDate = date;
  $summary.textContent = '표결을 불러오고 있어요';
  $card.innerHTML = `<div class="va-skeletons" aria-hidden="true">${'<div class="skeleton"></div>'.repeat(5)}</div>`;
  try {
    const rows = await rest(`d=eq.${encodeURIComponent(date)}&select=*&order=g0.asc.nullslast,ticker.asc`);
    const done = rows.filter((r) => typeof r.g0 === 'number').length;
    const buy = rows.filter((r) => r.g0 === 0).length;
    $summary.innerHTML =
      `<strong>${esc(dateLabel(date))}</strong> · 대상 ${rows.length}종목 · 판정 완료 ${done}종목 · 종합 매수 ${buy}종목`;
    renderRows(rows);
  } catch {
    $summary.textContent = '';
    $card.innerHTML = stateHtml('🌥️', '잠시 연결이 어려워요', '조금 뒤에 새로고침해 주세요.');
  }
}

async function init() {
  if (!isConfigured()) {
    $summary.textContent = '';
    $select.replaceChildren(new Option('날짜 선택'));
    $card.innerHTML = stateHtml('🔧', '아직 데이터에 연결하지 않았어요',
      'analysis/index.html 상단의 SUPABASE_URL과 SUPABASE_ANON_KEY를 채우면 표결이 나타나요.');
    return;
  }
  try {
    const rows = await rest('select=d&order=d.desc');
    const dates = [...new Set(rows.map((r) => r.d))];
    if (dates.length === 0) {
      $summary.textContent = '';
      $select.replaceChildren(new Option('날짜 선택'));
      $card.innerHTML = stateHtml('📭', '아직 쌓인 표결이 없어요', '표결이 저장되면 여기에 나타나요.');
      return;
    }
    $select.replaceChildren(...dates.map((d) => new Option(dateLabel(d), d)));
    $select.disabled = false;
    $select.addEventListener('change', () => loadDate($select.value));
    await loadDate(dates[0]);
  } catch {
    $summary.textContent = '';
    $select.replaceChildren(new Option('날짜 선택'));
    $card.innerHTML = stateHtml('🌥️', '잠시 연결이 어려워요', '조금 뒤에 새로고침해 주세요.');
  }
}

init();
</script>

</body>
</html>
